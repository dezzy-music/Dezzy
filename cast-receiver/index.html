<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DezzyMusic Cast Receiver</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --accent: #ED5564;
      --accent2: #c144b8;
      /* Deezer-style content colors: white over dark covers, black over bright ones.
         Set from JS based on the dominant palette color's luminance. */
      --fg: #ffffff;
      --fg-dim: rgba(255,255,255,0.72);
      --fg-faint: rgba(255,255,255,0.35);
      --track-bg: rgba(255,255,255,0.18);
      --text-shadow: 0 2px 12px rgba(0,0,0,0.5);
      /* Overscan-safe inset. Many TVs (Samsung especially) crop ~5% per edge, and
         some crop more. Keep every foreground element inside this margin; only the
         backgrounds are allowed to bleed to the physical edge. Tunable at runtime
         with ?safe=<percent> (see the script below). */
      --safe-x: 8vw;
      --safe-y: 8vh;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0c0c0f;
      font-family: 'Google Sans', 'Roboto', 'Segoe UI', sans-serif;
      overflow: hidden;
      cursor: none;
      color: #fff;
    }

    /* The framework needs this element to drive playback, but we render our own UI. */
    cast-media-player { display: none; }

    /* ------- Backgrounds ------- */
    #bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 25% 40%, #2a1420 0%, #0c0c0f 75%);
      transition: background 1.2s ease;
      z-index: 0;
    }

    /* Blurred-artwork background (PlayerBackgroundStyle BLUR / CUSTOM) */
    #bg-image {
      position: absolute;
      inset: -8%;
      width: 116%;
      height: 116%;
      object-fit: cover;
      filter: blur(48px) brightness(0.5) saturate(1.2);
      display: none;
      z-index: 0;
    }

    #bg-veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.45) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* ------- Idle screen ------- */
    #idle-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      background: radial-gradient(circle at 50% 40%, #2a1420 0%, #0c0c0f 70%);
      transition: opacity 0.6s ease;
    }
    #idle-screen.hidden { opacity: 0; pointer-events: none; }
    #idle-logo {
      width: 18vh; height: 18vh; border-radius: 4vh;
      box-shadow: 0 0 8vh rgba(237, 85, 100, 0.45);
      animation: pulse 2.4s ease-in-out infinite;
    }
    #idle-title { margin-top: 3.4vh; font-size: 5vh; font-weight: 600; letter-spacing: 0.05em; }
    #idle-subtitle { margin-top: 1.2vh; color: #b9b3b6; font-size: 2.6vh; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

    /* ------- Now playing: two-column TV layout inside an overscan-safe area ------- */
    /* Older TVs (esp. Samsung) crop ~5% on every edge; keep all content inside. */
    #now-playing {
      position: absolute;
      inset: 0;
      padding: var(--safe-y) var(--safe-x);
      display: flex;
      gap: 2vw;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #now-playing.visible { opacity: 1; }

    #left-pane {
      flex: 0 0 min(42vh, 40%);
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    #artwork-wrap {
      width: 100%;
      aspect-ratio: 1;
      max-width: min(40vh, 35vw);
      border-radius: 3vh;
      overflow: hidden;
      box-shadow: 0 3vh 9vh rgba(0,0,0,0.55), 0 0 12vh rgba(0,0,0,0.35);
      background: #1a1a1f;
      flex-shrink: 0;
    }
    #artwork { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Canvas de la canción (customData.dezzyCanvas): el video sustituye a la
       carátula y pasa a PANTALLA COMPLETA detrás de la información. */
    #canvas-video { display: none; width: 100%; height: 100%; object-fit: cover; }
    #artwork-wrap.canvas-mode {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      max-width: none; aspect-ratio: auto; border-radius: 0;
      box-shadow: none; z-index: -1; background: #000;
    }
    #artwork-wrap.canvas-mode #canvas-video { display: block; }
    #artwork-wrap.canvas-mode #artwork { display: none; }
    #artwork-wrap.canvas-mode::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.20), rgba(0,0,0,0.60));
    }

    #song-title {
      margin-top: 2.4vh;
      font-size: min(3.5vh, 4vw);
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--fg);
      text-shadow: var(--text-shadow);
      word-break: break-word;
    }
    #song-artist {
      margin-top: 0.8vh;
      font-size: min(2.2vh, 2.8vw);
      color: var(--fg-dim);
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: var(--text-shadow);
      word-break: break-word;
    }

    /* ------- Progress bar (styles mirror the phone's slider preference) ------- */
    #progress-row {
      margin-top: 3.6vh;
      width: 40vh;
      display: flex;
      align-items: center;
      gap: 1.2vw;
    }
    .time-label {
      font-size: 2vh;
      color: var(--fg-dim);
      font-variant-numeric: tabular-nums;
      min-width: 5.4vh;
    }

    #progress-track {
      position: relative;
      flex: 1;
      height: 0.8vh;
      border-radius: 0.4vh;
      background: var(--track-bg);
      overflow: hidden;
    }
    #progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.4s linear;
    }

    /* Thick / Capsule */
    .slider-thick #progress-track { height: 1.8vh; border-radius: 0.9vh; }
    .slider-capsule #progress-track { height: 2.2vh; border-radius: 1.1vh; background: var(--track-bg); }

    /* NeonGlow */
    .slider-neon #progress-track { overflow: visible; background: var(--track-bg); }
    .slider-neon #progress-fill {
      box-shadow: 0 0 1.4vh var(--accent), 0 0 3vh var(--accent);
    }

    /* Wavy: sine-wave mask over both layers, phase animated on the fill */
    .slider-wavy #progress-track {
      height: 2.4vh;
      border-radius: 0;
      background: none;
      overflow: hidden;
    }
    .slider-wavy #progress-track::before {
      content: '';
      position: absolute; inset: 0;
      background: var(--track-bg);
      -webkit-mask-image: var(--wave-mask);
              mask-image: var(--wave-mask);
      -webkit-mask-repeat: repeat-x; mask-repeat: repeat-x;
      -webkit-mask-size: auto 100%; mask-size: auto 100%;
    }
    .slider-wavy #progress-fill {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-mask-image: var(--wave-mask);
              mask-image: var(--wave-mask);
      -webkit-mask-repeat: repeat-x; mask-repeat: repeat-x;
      -webkit-mask-size: auto 100%; mask-size: auto 100%;
      animation: wavePhase 1.6s linear infinite;
    }
    @keyframes wavePhase {
      from { -webkit-mask-position-x: 0; mask-position-x: 0; }
      to   { -webkit-mask-position-x: 4.8vh; mask-position-x: 4.8vh; }
    }

    /* Dotted */
    .slider-dotted #progress-track {
      height: 1.4vh;
      background: none;
      overflow: hidden;
      border-radius: 0;
    }
    .slider-dotted #progress-track::before {
      content: '';
      position: absolute; inset: 0;
      background: var(--track-bg);
      -webkit-mask-image: radial-gradient(circle, #000 42%, transparent 46%);
              mask-image: radial-gradient(circle, #000 42%, transparent 46%);
      -webkit-mask-size: 1.4vh 1.4vh; mask-size: 1.4vh 1.4vh;
      -webkit-mask-repeat: repeat-x; mask-repeat: repeat-x;
    }
    .slider-dotted #progress-fill {
      -webkit-mask-image: radial-gradient(circle, #000 42%, transparent 46%);
              mask-image: radial-gradient(circle, #000 42%, transparent 46%);
      -webkit-mask-size: 1.4vh 1.4vh; mask-size: 1.4vh 1.4vh;
      -webkit-mask-repeat: repeat-x; mask-repeat: repeat-x;
    }

    /* DoubleLine */
    .slider-double #progress-track {
      height: 1.6vh;
      background: none;
      border-radius: 0;
      overflow: hidden;
    }
    .slider-double #progress-track::before {
      content: '';
      position: absolute; inset: 0;
      background: var(--track-bg);
      -webkit-mask-image: linear-gradient(#000 0 28%, transparent 28% 72%, #000 72% 100%);
              mask-image: linear-gradient(#000 0 28%, transparent 28% 72%, #000 72% 100%);
    }
    .slider-double #progress-fill {
      -webkit-mask-image: linear-gradient(#000 0 28%, transparent 28% 72%, #000 72% 100%);
              mask-image: linear-gradient(#000 0 28%, transparent 28% 72%, #000 72% 100%);
    }

    /* Waveform: JS-generated bars */
    .slider-waveform #progress-track {
      height: 3.2vh;
      background: none;
      border-radius: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .slider-waveform #progress-fill { display: none; }
    .wf-bar {
      flex: 1;
      background: var(--track-bg);
      border-radius: 1px;
      transition: background 0.3s ease;
    }
    .wf-bar.on { background: var(--accent); }

    /* ShootingStar: thin track, glowing comet head at the fill's end */
    .slider-shootingstar #progress-track {
      overflow: visible;
      height: 0.5vh;
      border-radius: 0.25vh;
      background: var(--track-bg);
    }
    .slider-shootingstar #progress-fill {
      background: linear-gradient(90deg, transparent 0%, var(--accent) 55%, #ffffff 100%);
      border-radius: 0.25vh;
    }
    .slider-shootingstar #progress-fill::after {
      content: '';
      position: absolute;
      right: -0.9vh;
      top: 50%;
      width: 1.8vh;
      height: 1.8vh;
      margin-top: -0.9vh;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 1.2vh #ffffff, 0 0 2.6vh var(--accent), 0 0 4vh var(--accent);
    }

    /* Aurora: flowing northern-lights gradient */
    .slider-aurora #progress-track {
      height: 1.6vh;
      border-radius: 0.8vh;
      background: var(--track-bg);
    }
    .slider-aurora #progress-fill {
      background: linear-gradient(90deg, #34e89e, #4facfe, #b06ab3, #34e89e);
      background-size: 300% 100%;
      animation: auroraFlow 6s linear infinite;
      box-shadow: 0 0 2vh rgba(79, 172, 254, 0.45);
    }
    @keyframes auroraFlow {
      from { background-position: 0% 0; }
      to   { background-position: 300% 0; }
    }

    /* ------- Lyrics (right pane) ------- */
    #right-pane {
      flex: 1 1 auto;
      height: 100%;
      position: relative;
      min-width: 0;
      padding: 0 1.5vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
              mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
    }
    #lyrics-viewport { height: 100%; width: 100%; overflow: hidden; }
    #lyrics-scroller {
      will-change: transform;
      padding: 32vh 0;
      text-align: center;
      width: 100%;
    }

    /* ------- Karaoke: one verse at a time, synced (previous / CURRENT / next) ------- */
    #karaoke {
      height: 100%;
      width: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3.5vh;
      text-align: center;
    }
    .k-line {
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: break-word;
      word-break: break-word;
      width: 100%;
    }
    .k-prev, .k-next {
      font-size: min(3.8vh, 3.0vw);
      color: var(--fg-faint);
      font-weight: 600;
    }
    .k-current {
      font-size: min(6.2vh, 4.8vw);
      font-weight: 800;
      color: var(--fg);
      text-shadow: var(--text-shadow);
    }
    .k-current.pop { animation: kIn 0.35s ease; }
    @keyframes kIn {
      from { opacity: 0; transform: translateY(1.8vh); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .lyric-line {
      font-size: min(4.2vh, 3.4vw);
      font-weight: 700;
      line-height: 1.5;
      padding: 1.2vh 0;
      color: var(--fg-faint);
      overflow-wrap: break-word;
      word-break: break-word;
      transform-origin: center center;
      transition: color 0.35s ease, transform 0.35s ease, text-shadow 0.35s ease,
                  filter 0.35s ease, opacity 0.35s ease, background 0.35s ease;
    }
    .lyric-line.active {
      color: var(--fg);
      transform: scale(1.08);
      text-shadow: var(--text-shadow);
    }
    .lyric-line.plain {
      font-size: min(4.0vh, 3.2vw);
      font-weight: 600;
      line-height: 1.6;
      color: var(--fg-dim);
      text-align: center;
      margin: 1vh 0;
      padding: 1vh 1.6vh;
      border-radius: 1.2vh;
      transition: all 0.35s ease;
    }
    .lyric-line.plain.active {
      color: var(--fg);
      font-size: min(4.6vh, 3.8vw);
      font-weight: 800;
      background: rgba(255,255,255,0.12);
      text-shadow: var(--text-shadow);
      transform: scale(1.05);
    }

    /* Alignment (default centered on TV for widescreen balance) */
    #lyrics-scroller, #karaoke { text-align: center; }
    .lyric-line { transform-origin: center center; }
    .align-left #lyrics-scroller, .align-left #karaoke { text-align: left; }
    .align-left .lyric-line { transform-origin: left center; }
    .align-right #lyrics-scroller, .align-right #karaoke { text-align: right; }
    .align-right .lyric-line { transform-origin: right center; }
    .align-center #lyrics-scroller, .align-center #karaoke { text-align: center; }
    .align-center .lyric-line { transform-origin: center center; }

    /* ---- Lyrics V2 styles (mirrors LyricsV2Style) ---- */
    .lv2-liquid .lyric-line { filter: blur(3px); opacity: 0.4; }
    .lv2-liquid .lyric-line.active { filter: blur(0); opacity: 1; }

    .lv2-spotlight .lyric-line { color: rgba(255,255,255,0.14); }
    .lv2-spotlight .lyric-line.active {
      color: #fff;
      text-shadow: 0 0 4vh rgba(255,255,255,0.55), 0 0 8vh rgba(255,255,255,0.30);
    }

    .lv2-depth .lyric-line { transform: scale(0.92); opacity: 0.35; filter: blur(1.5px); }
    .lv2-depth .lyric-line.active { transform: scale(1.10); opacity: 1; filter: blur(0); }

    .lv2-chromatic .lyric-line.active { color: var(--accent); text-shadow: 0 0 3vh var(--accent); }

    .lv2-glass .lyric-line { padding: 1.05vh 1.6vh; }
    .lv2-glass .lyric-line.active {
      background: rgba(255,255,255,0.12);
      border-radius: 1.6vh;
      backdrop-filter: blur(8px);
      box-shadow: 0 0.6vh 3vh rgba(0,0,0,0.35);
    }

    .lv2-minimal .lyric-line { opacity: 0.10; }
    .lv2-minimal .lyric-line.active { opacity: 1; }

    .lv2-bounce .lyric-line.active { animation: lyricBounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes lyricBounce {
      0% { transform: scale(0.94); }
      60% { transform: scale(1.10); }
      100% { transform: scale(1.05); }
    }

    .lv2-heat .lyric-line.active {
      background-image: linear-gradient(90deg, #4facfe, #ff8c42, #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
    }

    /* No-lyrics message */
    #no-lyrics {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.4vh;
      height: 100%;
      color: var(--fg-faint);
    }
    #no-lyrics svg { width: 9vh; height: 9vh; opacity: 0.55; }
    #no-lyrics span { font-size: 3vh; font-weight: 500; }

  </style>
</head>
<body>
  <cast-media-player></cast-media-player>

  <div id="bg"></div>
  <img id="bg-image" alt="" crossorigin="anonymous">
  <div id="bg-veil"></div>

  <div id="now-playing">
    <div id="left-pane">
      <div id="artwork-wrap"><img id="artwork" alt="" crossorigin="anonymous" loading="eager"><video id="canvas-video" muted autoplay loop playsinline></video></div>
      <div id="song-title"></div>
      <div id="song-artist"></div>
      <div id="progress-row">
        <span class="time-label" id="time-current">0:00</span>
        <div id="progress-track"><div id="progress-fill"></div></div>
        <span class="time-label" id="time-total" style="text-align:right">0:00</span>
      </div>
      <div id="volume-row" style="margin-top: 2.4vh; width: 40vh; display: flex; align-items: center; gap: 1vw;">
        <svg style="width: 2.2vh; height: 2.2vh; flex-shrink: 0; fill: var(--fg-dim);" viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <input id="volume-slider" type="range" min="0" max="100" value="100" style="flex: 1; height: 0.6vh; border-radius: 0.3vh; background: var(--track-bg); outline: none; -webkit-appearance: none; appearance: none; cursor: pointer;">
        <style>
          #volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 1.4vh; height: 1.4vh; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 0.8vh var(--accent); }
          #volume-slider::-moz-range-thumb { width: 1.4vh; height: 1.4vh; border-radius: 50%; background: var(--accent); cursor: pointer; border: none; box-shadow: 0 0 0.8vh var(--accent); }
        </style>
      </div>
    </div>

    <div id="right-pane">
      <div id="karaoke">
        <div class="k-line k-prev" id="k-prev"></div>
        <div class="k-line k-current" id="k-cur"></div>
        <div class="k-line k-next" id="k-next"></div>
      </div>
      <div id="lyrics-viewport"><div id="lyrics-scroller"></div></div>
      <div id="no-lyrics">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6zm-2 14a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/>
        </svg>
        <span>No se encontraron letras</span>
      </div>
    </div>
  </div>

  <div id="idle-screen">
    <img id="idle-logo" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20960%20960%22%3E%0A%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%0A%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ED5564%22%2F%3E%0A%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23c144b8%22%2F%3E%0A%3C%2FlinearGradient%3E%3C%2Fdefs%3E%0A%3Crect%20width%3D%22960%22%20height%3D%22960%22%20rx%3D%22200%22%20fill%3D%22url(%23g)%22%2F%3E%0A%3Cpath%20fill%3D%22%23fff%22%20d%3D%22M354%2C673L480%2C597L606%2C674L573%2C530L684%2C434L538%2C421L480%2C285L422%2C420L276%2C433L387%2C530L354%2C673ZM233%2C840L298%2C559L80%2C370L368%2C345L480%2C80L592%2C345L880%2C370L662%2C559L727%2C840L480%2C691L233%2C840ZM480%2C490L480%2C490L480%2C490L480%2C490L480%2C490L480%2C490L480%2C490L480%2C490L480%2C490L480%2C490Z%22%2F%3E%0A%3C%2Fsvg%3E" alt="DezzyMusic">
    <div id="idle-title">Dezzy</div>
    <div id="idle-subtitle">Listo para reproducir</div>
  </div>

  <script>
  (function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };
    var elBg = $('bg');
    var elBgImage = $('bg-image');
    var elVeil = $('bg-veil');
    var elIdle = $('idle-screen');
    var elNow = $('now-playing');
    var elArt = $('artwork');
    var elTitle = $('song-title');
    var elArtist = $('song-artist');
    var elRightPane = $('right-pane');
    var elViewport = $('lyrics-viewport');
    var elScroller = $('lyrics-scroller');
    var elKaraoke = $('karaoke');
    var elKPrev = $('k-prev');
    var elKCur = $('k-cur');
    var elKNext = $('k-next');
    var elNoLyrics = $('no-lyrics');
    var elCur = $('time-current');
    var elTotal = $('time-total');
    var elTrack = $('progress-track');
    var elFill = $('progress-fill');

    var qs = new URLSearchParams(location.search);
    var DEBUG = qs.has('debug');
    var debugStart = Date.now();

    // Overscan-safe margin override: ?safe=8 sets a symmetric 8% inset on every
    // edge. Bump this if the TV still crops content; lower it if it wastes space.
    (function () {
      var safe = parseFloat(qs.get('safe'));
      if (isFinite(safe) && safe >= 0 && safe <= 15) {
        document.documentElement.style.setProperty('--safe-x', safe + 'vw');
        document.documentElement.style.setProperty('--safe-y', safe + 'vh');
      }
    })();

    // Sine-wave mask used by the Wavy slider style.
    document.documentElement.style.setProperty(
      '--wave-mask',
      'url("data:image/svg+xml,' + encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' width='48' height='24' viewBox='0 0 48 24'>" +
        "<path d='M0 12 Q12 2 24 12 T48 12' fill='none' stroke='black' stroke-width='6' stroke-linecap='round'/></svg>"
      ) + '")'
    );

    // ---------- state ----------
    var syncedLines = null;
    var lyricsToken = 0;
    var activeIdx = -1;
    var lastTrackKey = null;
    var playerManager = null;
    var paletteColors = null;   // [{r,g,b}, {r,g,b}] from artwork
    // True when the palette was supplied by the phone (customData.dezzyPalette).
    // The phone can always read the artwork's pixels; the receiver often can't
    // (cross-origin canvas taint), so a phone palette wins and disables the
    // in-browser canvas extraction for that track.
    var paletteFromPhone = false;
    var uiPrefs = {
      lyricsAlign: 'CENTER',
      lyricsV2: false,
      lyricsV2Style: 'LIQUID_FLOW',
      background: 'GRADIENT',
      slider: 'Standard',
    };

    // ---------- helpers ----------
    function fmtTime(s) {
      if (!isFinite(s) || s < 0) s = 0;
      s = Math.floor(s);
      var m = Math.floor(s / 60), r = s % 60;
      return m + ':' + (r < 10 ? '0' : '') + r;
    }

    function cleanTitle(t) {
      return (t || '')
        .replace(/\s*[\(\[][^)\]]*(video|audio|lyric|official|visualizer|hd|4k|remaster)[^)\]]*[\)\]]/gi, '')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    function firstArtist(a) {
      return (a || '').split(/[,&]|feat\.?|ft\.?/i)[0].trim();
    }

    // ---------- appearance prefs ----------
    var V2_CLASS = {
      LIQUID_FLOW: 'lv2-liquid', SPOTLIGHT: 'lv2-spotlight', DEPTH_3D: 'lv2-depth',
      CHROMATIC: 'lv2-chromatic', GLASS_CARDS: 'lv2-glass', MINIMAL_FADE: 'lv2-minimal',
      BOUNCE: 'lv2-bounce', HEAT_MAP: 'lv2-heat',
      // TYPEWRITER / GEOMETRIC fall back to the default treatment
    };
    var SLIDER_CLASS = {
      Standard: '', Simple: '', Circular: '',
      Thick: 'slider-thick', Capsule: 'slider-capsule', Wavy: 'slider-wavy',
      NeonGlow: 'slider-neon', Dotted: 'slider-dotted', DoubleLine: 'slider-double',
      Waveform: 'slider-waveform',
      ShootingStar: 'slider-shootingstar', Aurora: 'slider-aurora',
    };

    var wfBars = [];
    function buildWaveformBars() {
      elTrack.innerHTML = '';
      elTrack.appendChild(elFill);
      wfBars = [];
      // deterministic pseudo-random heights so bars don't jump between tracks
      var seed = 7;
      for (var i = 0; i < 56; i++) {
        seed = (seed * 16807) % 2147483647;
        var h = 24 + (seed % 76); // 24%..99%
        var bar = document.createElement('div');
        bar.className = 'wf-bar';
        bar.style.height = h + '%';
        elTrack.appendChild(bar);
        wfBars.push(bar);
      }
    }

    function applyUiPrefs(p) {
      if (p) {
        uiPrefs.lyricsAlign = p.lyricsAlign || uiPrefs.lyricsAlign;
        uiPrefs.lyricsV2 = !!p.lyricsV2;
        uiPrefs.lyricsV2Style = p.lyricsV2Style || uiPrefs.lyricsV2Style;
        uiPrefs.background = p.background || uiPrefs.background;
        uiPrefs.slider = p.slider || uiPrefs.slider;
      }

      // lyrics alignment
      elRightPane.classList.remove('align-center', 'align-right', 'align-left');
      if (uiPrefs.lyricsAlign === 'LEFT') elRightPane.classList.add('align-left');
      else if (uiPrefs.lyricsAlign === 'RIGHT') elRightPane.classList.add('align-right');
      else elRightPane.classList.add('align-center');

      // lyrics V2 style
      Object.keys(V2_CLASS).forEach(function (k) { elRightPane.classList.remove(V2_CLASS[k]); });
      if (uiPrefs.lyricsV2 && V2_CLASS[uiPrefs.lyricsV2Style]) {
        elRightPane.classList.add(V2_CLASS[uiPrefs.lyricsV2Style]);
      }

      // slider style
      Object.keys(SLIDER_CLASS).forEach(function (k) {
        if (SLIDER_CLASS[k]) document.body.classList.remove(SLIDER_CLASS[k]);
      });
      var sliderCls = SLIDER_CLASS[uiPrefs.slider] || '';
      if (sliderCls) document.body.classList.add(sliderCls);
      if (uiPrefs.slider === 'Waveform') buildWaveformBars();
      else if (wfBars.length) { wfBars.forEach(function (b) { b.remove(); }); wfBars = []; }

      applyBackground();
    }

    // ---------- backgrounds ----------
    function setFallbackGradient() {
      paletteColors = null;
      applyBackground();
    }

    function setAccentFrom(colors) {
      var a = colors[0];
      var boost = function (v) { return Math.min(255, Math.round(v * 1.25 + 30)); };
      document.documentElement.style.setProperty(
        '--accent', 'rgb(' + boost(a.r) + ',' + boost(a.g) + ',' + boost(a.b) + ')');
      var a2 = colors[1] || a;
      document.documentElement.style.setProperty(
        '--accent2', 'rgb(' + boost(a2.r) + ',' + boost(a2.g) + ',' + boost(a2.b) + ')');
    }

    // Palette handed over by the phone via customData.dezzyPalette. Accepts either
    // [[r,g,b], [r,g,b]] or [{r,g,b}, {r,g,b}]. Returns true when applied.
    function applyPhonePalette(pal) {
      if (!pal || !pal.length) return false;
      var colors = [];
      for (var i = 0; i < pal.length && colors.length < 2; i++) {
        var c = pal[i];
        if (c == null) continue;
        var col = Array.isArray(c)
          ? { r: +c[0], g: +c[1], b: +c[2] }
          : { r: +c.r, g: +c.g, b: +c.b };
        if (isFinite(col.r) && isFinite(col.g) && isFinite(col.b)) colors.push(col);
      }
      if (!colors.length) return false;
      paletteColors = colors;
      paletteFromPhone = true;
      setAccentFrom(colors);
      applyBackground();
      return true;
    }

    function relLuma(c) {
      return (0.299 * c.r + 0.587 * c.g + 0.114 * c.b) / 255;
    }

    // Deezer-style content colors: black text/icons over bright covers, white over dark.
    function setContentColors(brightBg) {
      var s = document.documentElement.style;
      if (brightBg) {
        s.setProperty('--fg', '#101014');
        s.setProperty('--fg-dim', 'rgba(0,0,0,0.72)');
        s.setProperty('--fg-faint', 'rgba(0,0,0,0.42)');
        s.setProperty('--track-bg', 'rgba(0,0,0,0.18)');
        s.setProperty('--text-shadow', 'none');
      } else {
        s.setProperty('--fg', '#ffffff');
        s.setProperty('--fg-dim', 'rgba(255,255,255,0.72)');
        s.setProperty('--fg-faint', 'rgba(255,255,255,0.35)');
        s.setProperty('--track-bg', 'rgba(255,255,255,0.18)');
        s.setProperty('--text-shadow', '0 2px 12px rgba(0,0,0,0.5)');
      }
    }

    function applyBackground() {
      var mode = uiPrefs.background;
      if (mode === 'BLUR' || mode === 'CUSTOM') {
        // blurred artwork behind everything
        elBgImage.style.display = 'none';
        if (elArt.src) {
          elBgImage.src = elArt.src;
          elBgImage.style.display = 'block';
        }
        elBg.style.background = '#0a0a0d';
        elVeil.style.display = 'block';
        setContentColors(false);
        return;
      }
      elBgImage.style.display = 'none';

      // Dynamic colorful mesh gradient based on song artwork palette (matching Dezzy's colorful player)
      if (paletteColors && paletteColors.length >= 1) {
        var c1 = paletteColors[0];
        var c2 = paletteColors[1] || paletteColors[0];
        var rgb1 = 'rgb(' + Math.round(c1.r) + ',' + Math.round(c1.g) + ',' + Math.round(c1.b) + ')';
        var rgb2 = 'rgb(' + Math.round(c2.r) + ',' + Math.round(c2.g) + ',' + Math.round(c2.b) + ')';
        var rgbDark = 'rgb(' + Math.round(c1.r * 0.22) + ',' + Math.round(c1.g * 0.22) + ',' + Math.round(c1.b * 0.22) + ')';

        elBg.style.background = 'radial-gradient(circle at 18% 28%, ' + rgb1 + ' 0%, transparent 68%), ' +
                                'radial-gradient(circle at 82% 72%, ' + rgb2 + ' 0%, transparent 68%), ' +
                                'linear-gradient(135deg, ' + rgbDark + ' 0%, #08080a 100%)';
        elVeil.style.display = 'none';
        setContentColors(false);
      } else {
        // Always ensure a visible fallback gradient
        elBg.style.background = 'linear-gradient(135deg, #3a1a2a 0%, #1a0a1a 60%, #0c0c0f 100%)';
        elVeil.style.display = 'block';
        setContentColors(false);
      }
    }

    function extractPalette(img) {
      try {
        var w = 64, h = 64;
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        var cx = cv.getContext('2d');
        if (!cx) { setFallbackGradient(); return; }
        try {
          cx.drawImage(img, 0, 0, w, h);
        } catch (drawErr) {
          setFallbackGradient();
          return;
        }
        var data = cx.getImageData(0, 0, w, h).data;
        var bins = {};
        for (var i = 0; i < data.length; i += 4) {
          var r = data[i], g = data[i + 1], b = data[i + 2];
          var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
          var sat = mx === 0 ? 0 : (mx - mn) / mx;
          var lum = (r + g + b) / 3;
          if (lum < 18 || lum > 242) continue;
          var key = ((r >> 5) << 6) | ((g >> 5) << 3) | (b >> 5);
          var e = bins[key] || (bins[key] = { n: 0, r: 0, g: 0, b: 0, s: 0 });
          e.n++; e.r += r; e.g += g; e.b += b; e.s += sat;
        }
        var list = Object.keys(bins).map(function (k) {
          var e = bins[k];
          return { r: e.r / e.n, g: e.g / e.n, b: e.b / e.n, score: e.n * (0.35 + (e.s / e.n)) };
        }).sort(function (a, b2) { return b2.score - a.score; });

        if (!list.length) { setFallbackGradient(); return; }
        paletteColors = list.slice(0, 2);

        // accent color for slider/lyrics from the most vivid palette entry
        setAccentFrom(paletteColors);

        applyBackground();
      } catch (e) {
        setFallbackGradient();
      }
    }

    elArt.addEventListener('load', function () {
      // A phone-supplied palette always wins; skip the (often taint-blocked) canvas read,
      // but still refresh the background so BLUR/CUSTOM modes pick up the new artwork.
      if (paletteFromPhone) { applyBackground(); return; }
      extractPalette(elArt);
    });
    elArt.addEventListener('error', function () {
      if (!paletteFromPhone) setFallbackGradient();
    });
    // Timeout fallback: if image doesn't load in 4s, use fallback
    setTimeout(function () {
      if (!paletteFromPhone && (!paletteColors || paletteColors.length === 0)) {
        setFallbackGradient();
      }
    }, 4000);

    // ---------- lyrics ----------
    function parseLrc(lrc) {
      var out = [];
      var lines = (lrc || '').split(/\r?\n/);
      var re = /\[(\d+):(\d+(?:\.\d+)?)\]/g;
      for (var i = 0; i < lines.length; i++) {
        var raw = lines[i];
        var text = raw.replace(re, '').trim();
        var m; re.lastIndex = 0;
        while ((m = re.exec(raw)) !== null) {
          out.push({ t: parseInt(m[1], 10) * 60 + parseFloat(m[2]), text: text });
        }
      }
      out.sort(function (a, b) { return a.t - b.t; });
      return out.filter(function (l) { return l.text.length > 0; });
    }

    // Synced lyrics render karaoke-style: one verse at a time (previous / CURRENT / next),
    // instead of dumping the whole lyric sheet at once.
    function renderSynced(lines) {
      syncedLines = lines;
      activeIdx = -1;
      elNoLyrics.style.display = 'none';
      elViewport.style.display = 'none';
      elKaraoke.style.display = 'flex';
      elKPrev.textContent = '';
      elKCur.textContent = '';
      elKNext.textContent = lines.length ? lines[0].text : '';
    }

    function renderPlain(text) {
      syncedLines = null;
      elNoLyrics.style.display = 'none';
      elKaraoke.style.display = 'none';
      elViewport.style.display = 'block';
      elScroller.innerHTML = '';
      var lines = (text || '').split(/\r?\n/);
      for (var i = 0; i < lines.length; i++) {
        var d = document.createElement('div');
        d.className = 'lyric-line plain';
        d.textContent = lines[i] || ' ';
        elScroller.appendChild(d);
      }
      elScroller.style.transform = 'translateY(0)';
    }

    function renderNoLyrics() {
      syncedLines = null;
      elViewport.style.display = 'none';
      elKaraoke.style.display = 'none';
      elNoLyrics.style.display = 'flex';
    }

    function applyLocalLyrics(text) {
      lyricsToken++; // cancel any in-flight LRCLIB fetch
      var lines = parseLrc(text);
      if (lines.length >= 2) { renderSynced(lines); return; }
      if ((text || '').trim()) { renderPlain(text); return; }
      renderNoLyrics();
    }

    function fetchLyrics(title, artist, durationSec) {
      var token = ++lyricsToken;
      renderNoLyrics();

      var t = cleanTitle(title);
      var a = firstArtist(artist);
      if (!t) return;

      var getUrl = 'https://lrclib.net/api/get?artist_name=' + encodeURIComponent(a) +
        '&track_name=' + encodeURIComponent(t) +
        (durationSec > 0 ? '&duration=' + Math.round(durationSec) : '');

      fetch(getUrl)
        .then(function (r) { if (!r.ok) throw new Error('nf'); return r.json(); })
        .catch(function () {
          var q = 'https://lrclib.net/api/search?q=' + encodeURIComponent(a + ' ' + t);
          return fetch(q).then(function (r) { return r.json(); }).then(function (list) {
            if (!list || !list.length) throw new Error('nf');
            for (var i = 0; i < list.length; i++) {
              if (list[i].syncedLyrics) return list[i];
            }
            return list[0];
          });
        })
        .then(function (rec) {
          if (token !== lyricsToken) return;
          if (rec && rec.syncedLyrics) {
            var lines = parseLrc(rec.syncedLyrics);
            if (lines.length) { renderSynced(lines); return; }
          }
          if (rec && rec.plainLyrics) { renderPlain(rec.plainLyrics); return; }
          renderNoLyrics();
        })
        .catch(function () { if (token === lyricsToken) renderNoLyrics(); });
    }

    // ---------- sync loop ----------
    function getPositionSec() {
      if (DEBUG) return (Date.now() - debugStart) / 1000;
      try { return playerManager.getCurrentTimeSec() || 0; } catch (e) { return 0; }
    }
    function getDurationSec() {
      if (DEBUG) return 262;
      try {
        var d = playerManager.getDurationSec();
        if (d && d > 0) return d;
        var mi = playerManager.getMediaInformation();
        return (mi && mi.duration) || 0;
      } catch (e) { return 0; }
    }

    var lastScrollPos = 0;
    setInterval(function () {
      if (!elNow.classList.contains('visible')) return;

      var pos = getPositionSec();
      var dur = getDurationSec();
      elCur.textContent = fmtTime(pos);
      elTotal.textContent = fmtTime(dur);

      var frac = dur > 0 ? Math.min(1, pos / dur) : 0;
      elFill.style.width = (frac * 100) + '%';
      if (wfBars.length) {
        var onCount = Math.round(frac * wfBars.length);
        for (var b = 0; b < wfBars.length; b++) {
          wfBars[b].classList.toggle('on', b < onCount);
        }
      }

      // Synced lyrics: karaoke — show only the previous / current / next verse.
      if (syncedLines && syncedLines.length > 0) {
        var idx = -1;
        for (var i = 0; i < syncedLines.length; i++) {
          if (syncedLines[i].t <= pos + 0.15) idx = i; else break;
        }
        if (idx !== activeIdx) {
          activeIdx = idx;
          elKPrev.textContent = idx > 0 ? syncedLines[idx - 1].text : '';
          elKCur.textContent = idx >= 0 ? syncedLines[idx].text : '';
          elKNext.textContent = (idx + 1 < syncedLines.length) ? syncedLines[idx + 1].text : '';
          // Retrigger the entrance animation on the current verse.
          elKCur.classList.remove('pop');
          void elKCur.offsetWidth;
          elKCur.classList.add('pop');
        }
      }
      // Plain (non-synced) lyrics: scroll linearly through duration and highlight active line
      else if (elScroller.children.length > 0 && elScroller.children[0].classList.contains('plain')) {
        if (dur > 0) {
          var children = elScroller.children;
          var totalChildren = children.length;
          var activePlainIdx = Math.min(totalChildren - 1, Math.floor(frac * totalChildren));
          for (var c = 0; c < totalChildren; c++) {
            children[c].classList.toggle('active', c === activePlainIdx);
          }
          var scrollHeight = elScroller.scrollHeight;
          var viewportHeight = elViewport.clientHeight;
          var maxScroll = Math.max(0, scrollHeight - viewportHeight);
          var targetScroll = frac * maxScroll;
          if (Math.abs(targetScroll - lastScrollPos) > 2) {
            elScroller.style.transition = 'transform 0.4s linear';
            elScroller.style.transform = 'translateY(' + (-targetScroll) + 'px)';
            lastScrollPos = targetScroll;
          }
        }
      }
    }, 150);

    // ---------- metadata plumbing ----------
    function showTrack(title, artist, artUrl, durationSec, localLyrics, palette, canvasUrl) {
      var key = title + '|' + artist;
      elIdle.classList.add('hidden');
      elNow.classList.add('visible');
      if (key === lastTrackKey) return;
      lastTrackKey = key;

      // Canvas de la canción: video en bucle a pantalla completa en vez de carátula
      var elArtWrap = $('artwork-wrap');
      var elCanvas = $('canvas-video');
      if (canvasUrl && elCanvas) {
        elArtWrap.classList.add('canvas-mode');
        if (elCanvas.getAttribute('src') !== canvasUrl) {
          elCanvas.setAttribute('src', canvasUrl);
        }
        if (elCanvas.play) elCanvas.play().catch(function () {});
        if (elBgImage) elBgImage.style.display = 'none';
      } else if (elCanvas) {
        elArtWrap.classList.remove('canvas-mode');
        elCanvas.removeAttribute('src');
        if (elBgImage) elBgImage.style.display = '';
      }

      elTitle.textContent = title || '';
      elArtist.textContent = artist || '';
      elScroller.style.transform = 'translateY(0)';

      // Reset palette state for the new track, then prefer the phone's palette.
      paletteFromPhone = false;
      paletteColors = null;
      applyPhonePalette(palette);

      if (artUrl) {
        elArt.src = artUrl;
      } else {
        elArt.removeAttribute('src');
        if (!paletteFromPhone) setFallbackGradient();
      }
      if (localLyrics) {
        applyLocalLyrics(localLyrics);
      } else {
        fetchLyrics(title, artist, durationSec);
      }
    }

    function showIdle() {
      lastTrackKey = null;
      elNow.classList.remove('visible');
      elIdle.classList.remove('hidden');
    }

    // ---------- CAF wiring ----------
    var volSlider = $('volume-slider');
    var lastSliderValue = 100;

    if (volSlider) {
      volSlider.addEventListener('input', function () {
        lastSliderValue = parseInt(volSlider.value, 10);
        if (playerManager && playerManager.setVolume) {
          playerManager.setVolume(lastSliderValue / 100);
        }
      });
    }

    function wireCast() {
      var context = cast.framework.CastReceiverContext.getInstance();
      playerManager = context.getPlayerManager();

      playerManager.addEventListener(
        cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,
        function () {
          var mi = playerManager.getMediaInformation();
          var md = (mi && mi.metadata) || {};
          var img = (md.images && md.images.length) ? md.images[0].url : null;
          var custom = (mi && mi.customData) || {};
          applyUiPrefs(custom.dezzyPrefs || null);
          showTrack(
            md.title || '', md.artist || md.subtitle || '', img,
            (mi && mi.duration) || 0, custom.dezzyLyrics || null,
            custom.dezzyPalette || null, custom.dezzyCanvas || null
          );
        }
      );

      playerManager.addEventListener(
        cast.framework.events.EventType.MEDIA_STATUS,
        function () {
          var state = playerManager.getPlayerState();
          if (!state || state === cast.framework.messages.PlayerState.IDLE) showIdle();
          // Update volume slider from receiver state
          try {
            var vol = playerManager.getVolume();
            if (vol !== undefined && vol !== null) {
              volSlider.value = Math.round(vol * 100);
              lastSliderValue = Math.round(vol * 100);
            }
          } catch (e) {}
        }
      );

      var options = new cast.framework.CastReceiverOptions();
      options.maxInactivity = 3600;
      context.start(options);
    }

    if (!DEBUG) {
      // Load the CAF framework only for real Cast sessions; in ?debug design
      // preview it would block the page waiting on the device IPC socket.
      var s = document.createElement('script');
      s.src = '//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js';
      s.onload = wireCast;
      document.head.appendChild(s);
    } else {
      // ?debug — local design preview. Query params exercise the pref pipeline:
      //   &align=LEFT|CENTER|RIGHT  &v2=1&v2style=SPOTLIGHT  &bg=BLUR|DEFAULT|GRADIENT
      //   &slider=Wavy|Thick|NeonGlow|Dotted|DoubleLine|Waveform|Capsule
      applyUiPrefs({
        lyricsAlign: qs.get('align') || 'CENTER',
        lyricsV2: qs.get('v2') === '1',
        lyricsV2Style: qs.get('v2style') || 'LIQUID_FLOW',
        background: qs.get('bg') || 'GRADIENT',
        slider: qs.get('slider') || 'Standard',
      });
      var sampleArt = $('idle-logo').src;
      // &palette=237,85,100;193,68,184 exercises the phone-supplied palette path.
      var dbgPalette = null;
      if (qs.get('palette')) {
        dbgPalette = qs.get('palette').split(';').map(function (t) {
          return t.split(',').map(Number);
        });
      }
      showTrack('Die For You', 'The Weeknd', sampleArt, 262, null, dbgPalette);
      renderSynced([
        { t: 1,  text: "I'm findin' ways to articulate" },
        { t: 4,  text: "The feeling I'm goin' through" },
        { t: 7,  text: "I just can't say I don't love you" },
        { t: 10, text: "'Cause I love you, yeah" },
        { t: 13, text: "It's hard for me to communicate" },
        { t: 16, text: "The thoughts that I hold" },
        { t: 19, text: "But tonight I'm gon' let you know" },
        { t: 22, text: "Let me tell the truth" },
        { t: 25, text: "Baby, let me tell the truth, yeah" },
        { t: 28, text: "You know what I'm thinkin'" },
        { t: 31, text: "See it in your eyes" }
      ]);
    }
  })();
  </script>
</body>
</html>
