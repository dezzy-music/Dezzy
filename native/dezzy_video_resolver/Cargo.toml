[package]
name = "dezzy_video_resolver"
version = "0.1.0"
edition = "2021"

[lib]
name = "dezzy_video_resolver"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
once_cell = "1.20"
